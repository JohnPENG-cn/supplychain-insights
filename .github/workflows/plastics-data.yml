name: 更新塑料公开数据

on:
  workflow_dispatch:
  schedule:
    # 每月 12 日。BLS、Eurostat 和台塑月营收通常已经有上一月。
    - cron: '20 2 12 * *'

permissions:
  contents: write

concurrency:
  group: plastics-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 抓取公开数据
        run: node scripts/plastics/fetch.mjs
      - name: 检查图和原始数据一致
        run: node scripts/plastics/validate.mjs
      - name: 提交数据
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plastics data/cases/charts.json
          if git diff --cached --quiet; then
            echo "没有新数据"
          else
            git commit -m "更新塑料公开数据"
            git push origin HEAD:main
          fi
