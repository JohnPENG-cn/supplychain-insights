name: 更新 MLCC 公开数据

on:
  workflow_dispatch:
    inputs:
      source:
        description: 抓哪一项
        type: choice
        options:
          - all
          - twse
          - meti
        default: all
  schedule:
    # 台北时间上午约 9:20。11 日、15 日抓台湾月营收，20 日抓日本产量。
    - cron: '20 1 11 * *'
    - cron: '20 1 15 * *'
    - cron: '20 1 20 * *'
  pull_request:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: mlcc-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 测试解析和信号
        run: npm test
      - name: 抓取公开数据
        env:
          MLCC_SOURCE: ${{ github.event_name == 'schedule' && (contains(github.event.schedule, '1 20 ') && 'meti' || 'twse') || github.event.inputs.source || 'all' }}
          MLCC_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/mlcc/fetch.mjs
      - name: 失败时开或更新问题单
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mlcc/report-issues.mjs
      - name: 提交数据
        id: commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mlcc
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "更新 MLCC 公开数据"
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 触发网站重新构建
        if: github.event_name != 'pull_request' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
